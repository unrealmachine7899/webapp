<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proxy Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { display: flex; align-items: center; justify-content: center; padding: 12px; background: #1a1a1a; border-bottom: 1px solid #333; position: relative; z-index: 20; }
    .search-box { position: relative; width: 600px; max-width: 90%; }
    #search-bar { width: 100%; padding: 10px 16px; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; font-size: 15px; outline: none; }
    #suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #181818; border: 1px solid #444; border-radius: 6px; display: none; margin-top: 4px; overflow: hidden; z-index: 30; }
    #suggestions.show { display: block; }
    .sug-item { padding: 10px 16px; cursor: pointer; font-size: 14px; color: #ccc; }
    .sug-item:hover { background: #333; color: #fff; }
    .frame-container { flex: 1; width: 100%; height: 100%; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="search-box">
    <input id="search-bar" type="text" placeholder="Search DuckDuckGo or enter URL..." autocomplete="off">
    <div id="suggestions"></div>
  </div>
</div>

<div class="frame-container">
  <iframe id="proxy-frame" src="about:blank"></iframe>
</div>

<script>
  const bar = document.getElementById('search-bar');
  const sugs = document.getElementById('suggestions');
  const frame = document.getElementById('proxy-frame');
  let timer = null;

  function isUrl(str) {
    if (/^https?:\/\//i.test(str)) return true;
    return /^[a-z0-9-]+(\.[a-z]{2,})+/i.test(str) && !str.includes(' ');
  }

function executeSearch(rawInput) {
    const input = rawInput.trim();
    if (!input) return;

    let targetUrl = input;
    if (!isUrl(input)) {
      targetUrl = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
    } else if (!/^https?:\/\//i.test(input)) {
      targetUrl = 'https://' + input;
    }

    sugs.classList.remove('show');
    frame.src = '/proxy?url=' + encodeURIComponent(targetUrl);
  }

  function fetchSuggestions(query) {
    fetch('/api/autocomp?q=' + encodeURIComponent(query))
      .then(res => res.json())
      .then(data => {
        const results = data && data[1] ? data[1].slice(0, 5) : [];
        renderSuggestions(results);
      })
      .catch(() => sugs.classList.remove('show'));
  }

  function renderSuggestions(items) {
    sugs.innerHTML = '';
    if (!items.length) { sugs.classList.remove('show'); return; }

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'sug-item';
      div.textContent = item;
      div.addEventListener('click', () => executeSearch(item));
      sugs.appendChild(div);
    });
    sugs.classList.add('show');
  }

  bar.addEventListener('input', () => {
    clearTimeout(timer);
    const query = bar.value.trim();
    if (!query) { sugs.classList.remove('show'); return; }
    timer = setTimeout(() => fetchSuggestions(query), 200);
  });

  bar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') executeSearch(bar.value);
  });
</script>

</body>
</html>
