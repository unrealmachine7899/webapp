<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding-top: 100px; }
    .search-box { position: relative; width: 450px; }
    #search-bar { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
    #suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #1b1b1b; border: 1px solid #333; border-radius: 8px; display: none; margin-top: 6px; overflow: hidden; z-index: 10; }
    #suggestions.show { display: block; }
    .sug-item { padding: 10px 16px; cursor: pointer; font-size: 14px; color: #ccc; }
    .sug-item:hover { background: #333; color: #fff; }
  </style>
</head>
<body>

<div class="search-box">
  <input id="search-bar" type="text" placeholder="Search DuckDuckGo or enter URL..." autocomplete="off">
  <div id="suggestions"></div>
</div>

<script>
  const bar = document.getElementById('search-bar');
  const sugs = document.getElementById('suggestions');
  let timer = null;

  function isUrl(str) {
    if (/^https?:\/\//i.test(str)) return true;
    return /^[a-z0-9-]+(\.[a-z]{2,})+/i.test(str) && !str.includes(' ');
  }

  function executeSearch(rawInput) {
    const input = rawInput.trim();
    if (!input) return;

    let targetUrl = input;
    if (!isUrl(input)) {
      targetUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(input);
    } else if (!/^https?:\/\//i.test(input)) {
      targetUrl = 'https://' + input;
    }

    window.location.href = targetUrl;
  }

  function fetchSuggestions(query) {
    fetch('/api/autocomp?q=' + encodeURIComponent(query))
      .then(res => res.json())
      .then(data => {
        const results = data && data[1] ? data[1].slice(0, 5) : [];
        renderSuggestions(results);
      })
      .catch(() => sugs.classList.remove('show'));
  }

  function renderSuggestions(items) {
    sugs.innerHTML = '';
    if (!items.length) { sugs.classList.remove('show'); return; }

    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'sug-item';
      div.textContent = item;
      div.addEventListener('click', () => executeSearch(item));
      sugs.appendChild(div);
    });
    sugs.classList.add('show');
  }

  bar.addEventListener('input', () => {
    clearTimeout(timer);
    const query = bar.value.trim();
    if (!query) { sugs.classList.remove('show'); return; }
    timer = setTimeout(() => fetchSuggestions(query), 200);
  });

  bar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') executeSearch(bar.value);
  });
</script>

</body>
</html>
